name: moneybee
description: MoneyBee — offline personal finance tracker with on-device receipt OCR
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.4
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0
  intl: ^0.19.0
  uuid: ^4.4.0
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  # On-device PaddleOCR (Android arm64). Swap to MockOcrService if plugin unavailable.
  paddle_ocr_flutter: ^0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#F5A623"
  adaptive_icon_foreground: assets/icon/app_icon.png
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
